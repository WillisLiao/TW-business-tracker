name: Backfill history (run once)

# Loads up to five years of monthly history from the official MOPS summary pages.
# Takes about 20 minutes because requests are spaced out politely. Safe to re-run.
on:
  workflow_dispatch:
    inputs:
      months:
        description: Months of history to load
        default: '60'

concurrency:
  group: update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Backfill
        run: node pipeline/backfill.mjs --months "${{ github.event.inputs.months }}"
      - name: Commit data
        if: always()
        run: |
          git config user.name "data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No data changes."; exit 0; fi
          git commit -m "Backfill history"
          git pull --rebase origin main
          git push origin HEAD:main
